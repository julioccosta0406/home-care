<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="box">

<span class="eyebrow">Quality Life</span>
<h2>Criar conta</h2>

<form id="accountForm">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Digite seu email" autocomplete="email" required>

    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" placeholder="Digite seu telefone" autocomplete="tel" required>

    <label for="pass">Senha</label>
    <input type="password" id="pass" placeholder="Minimo de 6 caracteres" autocomplete="new-password" minlength="6" required>

    <label for="confirmPass">Confirmar senha</label>
    <input type="password" id="confirmPass" placeholder="Repita sua senha" autocomplete="new-password" minlength="6" required>

    <button type="submit">Cadastrar</button>
</form>

<p class="feedback" id="feedback" aria-live="polite"></p>

<a class="link" href="login.html">Ja tenho conta</a>

</div>

<script src="cliente-auth.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const accountForm = document.getElementById("accountForm");
const feedback = document.getElementById("feedback");
const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-d3d71.appspot.com",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function setLoading(isLoading) {
    const button = accountForm.querySelector("button");
    button.disabled = isLoading;
    button.textContent = isLoading ? "Cadastrando..." : "Cadastrar";
}

accountForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    setLoading(true);

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const telefone = document.getElementById("telefone").value.trim();
    const pass = document.getElementById("pass").value;
    const confirmPass = document.getElementById("confirmPass").value;

    if (pass !== confirmPass) {
        feedback.classList.remove("success");
        feedback.textContent = "As senhas precisam ser iguais.";
        setLoading(false);
        return;
    }

    try {
        const clienteSnapshot = await getDocs(
            query(
                collection(db, "clientes"),
                where("email", "==", email)
            )
        );

        if (!clienteSnapshot.empty) {
            feedback.classList.remove("success");
            feedback.textContent = "Esse email ja possui cadastro.";
            return;
        }

        await addDoc(
            collection(db, "clientes"),
            {
                nome,
                email,
                telefone,
                senha: pass,
                criadoEm: new Date().toISOString()
            }
        );

        feedback.classList.add("success");
        feedback.textContent = "Conta criada com sucesso.";
        accountForm.reset();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 900);
    } catch (erro) {
        console.log(erro);
        feedback.classList.remove("success");
        feedback.textContent = "Erro ao cadastrar. Verifique a conexao e tente de novo.";
    } finally {
        setLoading(false);
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendamento</title>

<link rel="stylesheet" href="agendamentos.css">

<!-- Calendário -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/air-datepicker@3.4.0/air-datepicker.css">

</head>

<body>

<div class="container">

    <div class="left">
        <h1>
            Agende Seu <br>
            Atendimento <br>
            <span class="highlight">Agora</span>
        </h1>
    </div>

    <div class="right">

        <h2>
            Escolha a data e horário
            <span class="highlight">
                que funciona para você
            </span>
        </h2>

        <form id="form">

            <input type="text" id="nome" placeholder="Seu nome" required>

            <div class="row">
                <input type="text" id="telefone" placeholder="Telefone">

                <input type="email" id="email" placeholder="Seu email" required>
            </div>

            <select id="servico" required>
                <option value="">Selecione um serviço</option>
                <option>Cuidador</option>
                <option>Enfermagem</option>
            </select>

            <input type="text" id="data" placeholder="Escolha a data" required>

<div class="horarios"></div>

            <input type="text" id="endereco" placeholder="Rua / Avenida" required>

            <input type="number" id="numero" placeholder="Número" required>

            <input type="number" id="idade" placeholder="idade" required>

            <input type="text" id="complemento" placeholder="Complemento">

            <textarea id="obs" placeholder="Observações"></textarea>

            <button id="btn" type="submit">
                Confirmar Agendamento
            </button>

        </form>

    </div>

</div>

<!-- calendário -->
<script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.4.0/air-datepicker.js"></script>
<script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.4.0/locale/pt-br.js"></script>
<script src="cliente-auth.js"></script>

<!-- firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-d3d71.appspot.com",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const clientSession = window.QualityLifeClientAuth.getSession();

if (!clientSession) {

    alert("Faça login para realizar um agendamento.");

    window.location.href = "login.html";

    throw new Error("Usuario nao autenticado.");
}

if (clientSession) {
    document.getElementById("nome").value = clientSession.nome || "";
    document.getElementById("email").value = clientSession.email || "";
    document.getElementById("telefone").value = clientSession.telefone || "";
}

let deviceId = localStorage.getItem("deviceId");

if (!deviceId) {

    deviceId = "device_" + Math.random().toString(36).substr(2, 9);

    localStorage.setItem("deviceId", deviceId);
}

// CALENDÁRIO
new AirDatepicker('#data', {

    locale: {
        days: ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'],
        daysShort: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
        daysMin: ['Do', 'Se', 'Te', 'Qa', 'Qi', 'Sx', 'Sa'],
        months: [
            'Janeiro',
            'Fevereiro',
            'Março',
            'Abril',
            'Maio',
            'Junho',
            'Julho',
            'Agosto',
            'Setembro',
            'Outubro',
            'Novembro',
            'Dezembro'
        ],
        monthsShort: [
            'Jan',
            'Fev',
            'Mar',
            'Abr',
            'Mai',
            'Jun',
            'Jul',
            'Ago',
            'Set',
            'Out',
            'Nov',
            'Dez'
        ],
        today: 'Hoje',
        clear: 'Limpar',
        dateFormat: 'dd/MM/yyyy',
        timeFormat: 'HH:mm',
        firstDay: 1
    },

    autoClose: true,
    dateFormat: 'dd-MM-yyyy',
    minDate: new Date(),

    onRenderCell({date, cellType}){

        if(cellType === 'day'){

            if(date.getDay() === 0){

                return {
                    disabled: true
                };

            }
        }
    }
}); 

// HORÁRIOS
const horariosContainer = document.querySelector(".horarios");

for(let i = 0; i <= 23; i++){

    let hora = i.toString().padStart(2, '0') + ":00";

    horariosContainer.innerHTML += `

        <label class="hora-card">

            <input 
                type="radio" 
                name="hora" 
                value="${hora}"
                required
            >

            <span>${hora}</span>

        </label>

    `;
}

// PEGAR AGENDAMENTOS
let agendamentos = [];

async function carregarAgendamentos(){

    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    agendamentos = [];

    querySnapshot.forEach((docItem) => {

        agendamentos.push(docItem.data());

    });
}

await carregarAgendamentos();

// BLOQUEAR HORÁRIO

document.addEventListener("change", function(e){

    if(e.target.name === "hora"){

        const data = document.getElementById("data").value;

        const hora = e.target.value;

        const ocupado = agendamentos.find(
            a => a.data === data && a.hora === hora
        );

        if(ocupado){

            alert("Esse horário já está ocupado!");

            e.target.checked = false;
        }
    }
});

// BOTÃO
const form = document.getElementById("form");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const dados = {

        nome: document.getElementById("nome").value,

        telefone: document.getElementById("telefone").value,

        email: document.getElementById("email").value,

        servico: document.getElementById("servico").value,

        data: document.getElementById("data").value,

        hora: document.querySelector('input[name="hora"]:checked')?.value,

        endereco: document.getElementById("endereco").value,

        numero: document.getElementById("numero").value,

        complemento: document.getElementById("complemento").value,

        obs: document.getElementById("obs").value,

        status: "Pendente",

        deviceId: deviceId
    };

    try{

        const agendamentoRef = await addDoc(
            collection(db, "agendamentos"),
            dados
        );

        await addDoc(
            collection(db, "historicoAgendamentos"),
            {
                ...dados,
                agendamentoId: agendamentoRef.id,
                statusHistorico: "Pendente",
                criadoEm: new Date().toISOString(),
                atualizadoEm: new Date().toISOString()
            }
        );

        alert("Agendamento enviado com sucesso!");

        form.reset();

    }catch(erro){

        console.log(erro);

        alert("Erro ao enviar agendamento");

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendamento</title>

<link rel="stylesheet" href="agendamentos.css">

<!-- Calendário -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/air-datepicker@3.4.0/air-datepicker.css">

<style>

body{
    font-family: Arial;
    background: #f5f5f5;
    margin: 0;
}

.container{
    display: flex;
    gap: 40px;
    padding: 40px;
}

.left{
    flex: 1;
    background: url('img/Cuidando com carinho e sorriso.png') center/cover no-repeat;
    border-radius: 20px;
    height: 600px;
    position: relative;
    padding: 30px;
    color: white;
}

.left h1{
    position: absolute;
    bottom: 30px;
    font-size: 42px;
}

.right{
    flex: 1;
}

.right h2{
    font-size: 32px;
}

.highlight{
    color: #2bb7a4;
}

form{
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 20px;
}

input, select, textarea, button{
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    width: 100%;
    box-sizing: border-box;
}

.row{
    display: flex;
    gap: 10px;
}

button{
    background: #2bb7a4;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

button:hover{
    opacity: 0.9;
}

</style>

</head>

<body>

<div class="container">

    <div class="left">
        <h1>
            Agende Seu <br>
            Atendimento <br>
            <span class="highlight">Agora</span>
        </h1>
    </div>

    <div class="right">

        <h2>
            Escolha a data e horário
            <span class="highlight">
                que funciona para você
            </span>
        </h2>

        <form id="form">

            <input type="text" id="nome" placeholder="Seu nome" required>

            <div class="row">
                <input type="text" id="telefone" placeholder="Telefone">

                <input type="email" id="email" placeholder="Seu email" required>
            </div>

            <select id="servico" required>
                <option value="">Selecione um serviço</option>
                <option>Cuidador</option>
                <option>Enfermagem</option>
            </select>

            <input type="text" id="data" placeholder="Escolha a data" required>

            <select id="hora" required>
                <option value="">Escolha o horário</option>
            </select>

            <input type="text" id="endereco" placeholder="Rua / Avenida" required>

            <input type="text" id="numero" placeholder="Número" required>

            <input type="text" id="complemento" placeholder="Complemento">

            <textarea id="obs" placeholder="Observações"></textarea>

            <button id="btn" type="submit">
                Confirmar Agendamento
            </button>

        </form>

    </div>

</div>

<!-- calendário -->
<script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.4.0/air-datepicker.js"></script>

<!-- firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-d3d71.appspot.com",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let deviceId = localStorage.getItem("deviceId");

if (!deviceId) {

    deviceId = "device_" + Math.random().toString(36).substr(2, 9);

    localStorage.setItem("deviceId", deviceId);
}

// CALENDÁRIO
new AirDatepicker('#data', {
    autoClose: true,
    dateFormat: 'dd-MM-yyyy',
    minDate: new Date(),

    onRenderCell({date, cellType}){

        if(cellType === 'day'){

            if(date.getDay() === 0){

                return {
                    disabled: true
                };

            }
        }
    }
});

// HORÁRIOS
const horaSelect = document.getElementById("hora");

for(let i = 0; i <= 23; i++){

    let hora = i.toString().padStart(2, '0') + ":00";

    let option = document.createElement("option");

    option.value = hora;
    option.textContent = hora;

    horaSelect.appendChild(option);
}

// PEGAR AGENDAMENTOS
let agendamentos = [];

async function carregarAgendamentos(){

    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    agendamentos = [];

    querySnapshot.forEach((docItem) => {

        agendamentos.push(docItem.data());

    });
}

await carregarAgendamentos();

// BLOQUEAR HORÁRIO
horaSelect.addEventListener("change", function(){

    const data = document.getElementById("data").value;

    const hora = this.value;

    const ocupado = agendamentos.find(
        a => a.data === data && a.hora === hora
    );

    if(ocupado){

        alert("Esse horário já está ocupado!");

        this.value = "";
    }

});

// BOTÃO
const form = document.getElementById("form");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const dados = {

        nome: document.getElementById("nome").value,

        telefone: document.getElementById("telefone").value,

        email: document.getElementById("email").value,

        servico: document.getElementById("servico").value,

        data: document.getElementById("data").value,

        hora: document.getElementById("hora").value,

        endereco: document.getElementById("endereco").value,

        numero: document.getElementById("numero").value,

        complemento: document.getElementById("complemento").value,

        obs: document.getElementById("obs").value,

        status: "Pendente",

        deviceId: deviceId
    };

    try{

        await addDoc(
            collection(db, "agendamentos"),
            dados
        );

        alert("Agendamento enviado com sucesso!");

        form.reset();

    }catch(erro){

        console.log(erro);

        alert("Erro ao enviar agendamento");

    }

});

</script>

</body>
</html>

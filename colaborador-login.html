<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Colaborador</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="box">

<span class="eyebrow">Quality Life</span>
<h2>Acesso do colaborador</h2>

<form id="colaboradorForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Email profissional" autocomplete="email" required>

    <label for="pass">Senha</label>
    <input type="password" id="pass" placeholder="Digite sua senha" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
</form>

<p class="feedback" id="feedback" aria-live="polite"></p>

<a class="link" href="login.html">Voltar para login do cliente</a>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const colaboradorForm = document.getElementById("colaboradorForm");
const feedback = document.getElementById("feedback");
const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-d3d71.appspot.com",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function setLoading(isLoading) {
    const button = colaboradorForm.querySelector("button");
    button.disabled = isLoading;
    button.textContent = isLoading ? "Entrando..." : "Entrar";
}

colaboradorForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    setLoading(true);

    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass = document.getElementById("pass").value;

    try {
        const adminSnapshot = await getDocs(
            query(
                collection(db, "admins"),
                where("email", "==", email)
            )
        );

        const admin = adminSnapshot.empty ? null : adminSnapshot.docs[0].data();

        if (admin && admin.senha === pass) {
            localStorage.setItem("qualityLifeAdminSession", JSON.stringify({
                nome: admin.nome || "Administrador",
                email: admin.email,
                tipo: "admin"
            }));

            feedback.classList.add("success");
            feedback.textContent = "Acesso administrativo liberado.";
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 500);
            return;
        }

        const colaboradorSnapshot = await getDocs(
            query(
                collection(db, "colaboradores"),
                where("email", "==", email)
            )
        );

        const colaborador = colaboradorSnapshot.empty ? null : colaboradorSnapshot.docs[0].data();

        if (!colaborador || colaborador.senha !== pass) {
            feedback.classList.remove("success");
            feedback.textContent = "Email ou senha incorretos, ou colaborador nao cadastrado.";
            return;
        }

        localStorage.setItem("qualityLifeColaboradorSession", JSON.stringify({
            nome: colaborador.nome,
            email: colaborador.email,
            funcao: colaborador.funcao || "Colaborador"
        }));

        feedback.classList.add("success");
        feedback.textContent = "Login de colaborador realizado.";
        setTimeout(() => {
            window.location.href = "painel-colaborador.html";
        }, 700);
    } catch (erro) {
        console.log(erro);
        feedback.classList.remove("success");
        feedback.textContent = "Erro ao entrar. Verifique a conexao e tente de novo.";
    } finally {
        setLoading(false);
    }
});
</script>

</body>
</html>

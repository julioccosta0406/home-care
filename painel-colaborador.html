<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Colaborador</title>
<link rel="stylesheet" href="meus-agendamentos.css">
</head>

<body>

<div class="collab-header">
    <div>
        <h1>Painel do colaborador</h1>
        <p id="welcomeText">Carregando acesso...</p>
    </div>
    <button id="logoutBtn" type="button">Sair</button>
</div>

<div id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const session = JSON.parse(localStorage.getItem("qualityLifeColaboradorSession") || "null");
const welcomeText = document.getElementById("welcomeText");
const logoutBtn = document.getElementById("logoutBtn");
const lista = document.getElementById("lista");

if (!session) {
    window.location.href = "colaborador-login.html";
    throw new Error("Colaborador nao autenticado.");
}

welcomeText.textContent = `Bem-vindo, ${session.nome || session.email}.`;

logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("qualityLifeColaboradorSession");
    window.location.href = "colaborador-login.html";
});

const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-d3d71.appspot.com",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g, (char) => {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

async function carregarAgendamentos(){
    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    const agendamentos = [];

    querySnapshot.forEach((docItem) => {
        const agendamento = docItem.data();

        if (agendamento.especialista !== session.nome) {
            return;
        }

        agendamentos.push({
            id: docItem.id,
            ...agendamento
        });
    });

    agendamentos.sort((a, b) => {
        return `${a.data || ""} ${a.hora || ""}`.localeCompare(`${b.data || ""} ${b.hora || ""}`);
    });

    render(agendamentos);
}

function render(agendamentos){
    lista.innerHTML = "";

    if (agendamentos.length === 0) {
        lista.innerHTML = `
            <div class="card">
                Nenhum agendamento encontrado para ${escapeHTML(session.nome)}.
            </div>
        `;
        return;
    }

    agendamentos.forEach((a) => {
        lista.innerHTML += `
            <div class="card">
                <strong>${escapeHTML(a.nome)}</strong><br>
                ${escapeHTML(a.data)} às ${escapeHTML(a.hora)}<br>
                ${escapeHTML(a.endereco)}, ${escapeHTML(a.numero)}<br>
                Idade: ${escapeHTML(a.idade || "-")}<br>
                ${escapeHTML(a.telefone)}<br>
                ${escapeHTML(a.email)}<br>
                Serviço: ${escapeHTML(a.servico || "-")}<br>
                Observações: ${escapeHTML(a.obs || "-")}<br><br>
                Status: <b>${escapeHTML(a.status || "Pendente")}</b>
            </div>
        `;
    });
}

carregarAgendamentos();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

h1{
    text-align:center;
}

#lista{
    display:grid;
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
    margin-top:10px;
    color:white;
}

.confirmar{
    background:green;
}

.excluir{
    background:red;
}

</style>

</head>

<body>

<h1>📅 Painel Admin</h1>

<div id="lista"></div>

<script>
emailjs.init("DDHrifvWlHewH4wVa");
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",

  authDomain: "quality-life-d3d71.firebaseapp.com",

  projectId: "quality-life-d3d71",

  storageBucket: "quality-life-d3d71.firebasestorage.app",

  messagingSenderId: "35765405424",

  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const lista = document.getElementById("lista");

async function carregarAgendamentos(){

    lista.innerHTML = "";

    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    querySnapshot.forEach((docItem)=>{

        const a = docItem.data();

        lista.innerHTML += `

        <div class="card" style="position:relative;">
            ${
    a.status === "Confirmado"
    ?
    `<button 
        onclick="limparConfirmado('${docItem.id}')"
        style="
            position:absolute;
            top:10px;
            right:10px;
            width:30px;
            height:30px;
            border-radius:50%;
            border:none;
            background:white;
            color:black;
            font-weight:bold;
            cursor:pointer;
        ">
        ✕
    </button>`
    :
    ""
}

            <strong>${a.nome}</strong><br><br>

            📅 ${a.data} às ${a.hora}<br>

            🏠 ${a.endereco}, ${a.numero}<br>

            📞 ${a.telefone}<br>

            ✉ ${a.email}<br>

            💼 ${a.servico}<br>

            📝 ${a.obs || "-"}<br><br>

            Status: <b>${a.status || "Pendente"}</b><br>

           ${
    a.status === "Confirmado"
    ?
    `<button class="confirmar" disabled
    style="background:gray; cursor:not-allowed;">
        Confirmado
    </button>`
    :
    `<button class="confirmar"
    onclick="confirmar(
        '${docItem.id}',
        '${a.email}',
        '${a.nome}',
        '${a.data}'
    )">

        Confirmar

    </button>`
}

            <button class="excluir"
            onclick="excluir(
                '${docItem.id}',
                '${a.email}',
                '${a.nome}'
            )">

                Cancelar

            </button>

        </div>

        `;
    });
}

window.confirmar = async function(id, email, nome, data){

    await updateDoc(
        doc(db, "agendamentos", id),
        {
            status: "Confirmado"
        }
    );

    emailjs.send(
        "service_ozpb5p5",
        "template_rz0chvq",
        {
            email: email,
            nome: nome,
            mensagem: `Seu agendamento para ${data} foi confirmado!`
        }
    )
    .then(() => {

        alert("Agendamento confirmado e email enviado!");

    })
    .catch((erro) => {

        console.log(erro);

        alert("Confirmado, mas erro ao enviar email");

    });

    carregarAgendamentos();
}

window.excluir = async function(id, email, nome){

    if(confirm("Deseja cancelar esse agendamento?")){

        await deleteDoc(
            doc(db, "agendamentos", id)
        );

        emailjs.send(
            "service_ozpb5p5",
            "template_ivc58aj",
            {
                email: email,
                nome: nome,
                mensagem: "Seu agendamento foi cancelado. Entre em contato para remarcar."
            }
        );

        alert("Agendamento cancelado!");

        carregarAgendamentos();
    }
}

window.limparConfirmado = async function(id){

    if(confirm("Remover agendamento confirmado?")){

        await deleteDoc(
            doc(db, "agendamentos", id)
        );

        carregarAgendamentos();
    }
}

carregarAgendamentos();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="admin-auth.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    margin:0;
    padding:30px;
    color:#1f2933;
}

.admin-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    max-width:1100px;
    margin:0 auto;
}

.admin-top h1{
    margin:0;
}

.admin-user{
    margin-top:8px;
    color:#60717d;
    font-size:14px;
}

.admin-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.register-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:40px;
    padding:0 18px;
    border-radius:8px;
    background:#159f98;
    color:white;
    font-size:14px;
    font-weight:bold;
    text-decoration:none;
}

#lista{
    display:grid;
    gap:20px;
    max-width:1100px;
    margin-top:30px;
    margin-left:auto;
    margin-right:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.empty{
    background:white;
    padding:26px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.08);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
    margin-top:10px;
    color:white;
}

.confirmar{
    background:green;
}

.excluir{
    background:red;
}

.logout{
    background:#1f2933;
}

.close-card{
    position:absolute;
    top:10px;
    right:10px;
    width:30px;
    height:30px;
    padding:0;
    border-radius:50%;
    background:white;
    color:black;
    font-weight:bold;
}

@media(max-width:700px){
    body{
        padding:18px;
    }

    .admin-top{
        align-items:flex-start;
        flex-direction:column;
    }
}

</style>

</head>

<body>

<div class="admin-top">
    <div>
        <h1>📅 Painel Admin</h1>
        <p class="admin-user" id="adminUser"></p>
    </div>
    <div class="admin-actions">
        <a class="register-link" href="cadastro.html">Cadastrar acesso</a>
        <button class="logout" id="logoutBtn" type="button">Sair</button>
    </div>
</div>

<div id="lista"></div>

<script>
emailjs.init("DDHrifvWlHewH4wVa");
</script>

<script type="module">

if (!window.QualityLifeAuth.isAdminLoggedIn()) {
    window.location.replace("admin-login.html");
    throw new Error("Acesso administrativo bloqueado.");
}

const session = window.QualityLifeAuth.getSession();
document.getElementById("adminUser").textContent = `Acessando como ${session.nome || session.usuario}`;
document.getElementById("logoutBtn").addEventListener("click", () => {
    window.QualityLifeAuth.logout();
    window.location.href = "admin-login.html";
});

const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");

const {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    query,
    where
} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

const firebaseConfig = {

  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",

  authDomain: "quality-life-d3d71.firebaseapp.com",

  projectId: "quality-life-d3d71",

  storageBucket: "quality-life-d3d71.firebasestorage.app",

  messagingSenderId: "35765405424",

  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const lista = document.getElementById("lista");

function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g, (char) => {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

function createInfoLine(label, value){
    return `${label} ${escapeHTML(value || "-")}<br>`;
}

async function atualizarHistorico(agendamentoId, statusHistorico, dadosFallback = {}){
    const historicoSnapshot = await getDocs(
        query(
            collection(db, "historicoAgendamentos"),
            where("agendamentoId", "==", agendamentoId)
        )
    );

    const updates = [];

    if (historicoSnapshot.empty) {
        await addDoc(
            collection(db, "historicoAgendamentos"),
            {
                ...dadosFallback,
                agendamentoId,
                status: statusHistorico,
                statusHistorico,
                criadoEm: new Date().toISOString(),
                atualizadoEm: new Date().toISOString()
            }
        );
        return;
    }

    historicoSnapshot.forEach((historicoDoc) => {
        updates.push(
            updateDoc(
                doc(db, "historicoAgendamentos", historicoDoc.id),
                {
                    status: statusHistorico,
                    statusHistorico,
                    atualizadoEm: new Date().toISOString()
                }
            )
        );
    });

    await Promise.all(updates);
}

async function carregarAgendamentos(){

    lista.innerHTML = "";

    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    querySnapshot.forEach((docItem)=>{

        const a = docItem.data();
        const card = document.createElement("div");
        card.className = "card";
        card.style.position = "relative";

        if (a.status === "Confirmado") {
            const closeButton = document.createElement("button");
            closeButton.className = "close-card";
            closeButton.type = "button";
            closeButton.textContent = "x";
            closeButton.addEventListener("click", () => limparConfirmado(docItem.id, a));
            card.appendChild(closeButton);
        }

        card.insertAdjacentHTML("beforeend", `
            <strong>${escapeHTML(a.nome)}</strong><br><br>
            ${createInfoLine("📅", `${a.data || "-"} às ${a.hora || "-"}`)}
            ${createInfoLine("🏠", `${a.endereco || "-"}, ${a.numero || "-"}`)}
            ${createInfoLine("📞", a.telefone)}
            ${createInfoLine("✉", a.email)}
            ${createInfoLine("💼", a.servico)}
            ${createInfoLine("📝", a.obs)}
            <br>
            Status: <b>${escapeHTML(a.status || "Pendente")}</b><br>
        `);

        const confirmButton = document.createElement("button");
        confirmButton.className = "confirmar";
        confirmButton.type = "button";

        if (a.status === "Confirmado") {
            confirmButton.disabled = true;
            confirmButton.style.background = "gray";
            confirmButton.style.cursor = "not-allowed";
            confirmButton.textContent = "Confirmado";
        } else {
            confirmButton.textContent = "Confirmar";
            confirmButton.addEventListener("click", () => confirmar(docItem.id, a));
        }

        const deleteButton = document.createElement("button");
        deleteButton.className = "excluir";
        deleteButton.type = "button";
        deleteButton.textContent = "Cancelar";
        deleteButton.addEventListener("click", () => excluir(docItem.id, a));

        card.append(confirmButton, deleteButton);
        lista.appendChild(card);
    });

    if (querySnapshot.empty) {
        lista.innerHTML = `<div class="empty">Nenhum agendamento encontrado.</div>`;
    }
}

window.confirmar = async function(id, agendamento){

    await updateDoc(
        doc(db, "agendamentos", id),
        {
            status: "Confirmado"
        }
    );

    await atualizarHistorico(id, "Confirmado", agendamento);

    emailjs.send(
        "service_ozpb5p5",
        "template_rz0chvq",
        {
            email: agendamento.email,
            nome: agendamento.nome,
            mensagem: `Seu agendamento para ${agendamento.data} foi confirmado!`
        }
    )
    .then(() => {

        alert("Agendamento confirmado e email enviado!");

    })
    .catch((erro) => {

        console.log(erro);

        alert("Confirmado, mas erro ao enviar email");

    });

    carregarAgendamentos();
}

window.excluir = async function(id, agendamento){

    if(confirm("Deseja cancelar esse agendamento?")){

        await atualizarHistorico(id, "Cancelado", agendamento);

        await deleteDoc(
            doc(db, "agendamentos", id)
        );

        emailjs.send(
            "service_ozpb5p5",
            "template_ivc58aj",
            {
                email: agendamento.email,
                nome: agendamento.nome,
                mensagem: "Seu agendamento foi cancelado. Entre em contato para remarcar."
            }
        );

        alert("Agendamento cancelado!");

        carregarAgendamentos();
    }
}

window.limparConfirmado = async function(id, agendamento){

    if(confirm("Remover agendamento confirmado?")){

        await atualizarHistorico(id, "Concluido", agendamento);

        await deleteDoc(
            doc(db, "agendamentos", id)
        );

        carregarAgendamentos();
    }
}

carregarAgendamentos();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Senha</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="box">

<span class="eyebrow">Quality Life</span>
<h2>Recuperar senha</h2>

<form id="resetForm">
    <label for="email">Email cadastrado</label>
    <input type="email" id="email" placeholder="Digite seu email" autocomplete="email" required>

    <label for="pass">Nova senha</label>
    <input type="password" id="pass" placeholder="Minimo de 6 caracteres" autocomplete="new-password" minlength="6" required>

    <label for="confirmPass">Confirmar nova senha</label>
    <input type="password" id="confirmPass" placeholder="Repita a nova senha" autocomplete="new-password" minlength="6" required>

    <button type="submit">Atualizar senha</button>
</form>

<p class="feedback" id="feedback" aria-live="polite"></p>

<a class="link" href="login.html">Voltar para o login</a>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const resetForm = document.getElementById("resetForm");
const feedback = document.getElementById("feedback");
const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-d3d71.appspot.com",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function setLoading(isLoading) {
    const button = resetForm.querySelector("button");
    button.disabled = isLoading;
    button.textContent = isLoading ? "Atualizando..." : "Atualizar senha";
}

resetForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    setLoading(true);

    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass = document.getElementById("pass").value;
    const confirmPass = document.getElementById("confirmPass").value;

    if (pass !== confirmPass) {
        feedback.classList.remove("success");
        feedback.textContent = "As senhas precisam ser iguais.";
        setLoading(false);
        return;
    }

    try {
        const clienteSnapshot = await getDocs(
            query(
                collection(db, "clientes"),
                where("email", "==", email)
            )
        );

        if (clienteSnapshot.empty) {
            feedback.classList.remove("success");
            feedback.textContent = "Email nao encontrado.";
            return;
        }

        await updateDoc(
            doc(db, "clientes", clienteSnapshot.docs[0].id),
            {
                senha: pass,
                senhaAtualizadaEm: new Date().toISOString()
            }
        );

        feedback.classList.add("success");
        feedback.textContent = "Senha atualizada com sucesso.";
        resetForm.reset();
    } catch (erro) {
        console.log(erro);
        feedback.classList.remove("success");
        feedback.textContent = "Erro ao atualizar senha. Tente de novo.";
    } finally {
        setLoading(false);
    }
});
</script>

</body>
</html>

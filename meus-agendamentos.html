<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Agendamentos</title>
<script src="meus-agendamentos.js"></script>
<link rel="stylesheet" href="meus-agendamentos.css">
</head>

<body>

<h1>📅 Agendamentos</h1>

<div id="lista"></div>

</body>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-fe-d3d71.firebasestorage.app",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435",
  measurementId: "G-3TJ7ZTYD5X"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// ID do dispositivo atual
const deviceId = localStorage.getItem("deviceId");

let lista = document.getElementById("lista");

let agendamentos = [];

async function carregar(){

    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    agendamentos = [];

    querySnapshot.forEach((docItem) => {

    const dados = docItem.data();

    if(dados.deviceId === deviceId){

        agendamentos.push({
            id: docItem.id,
         ...dados
         });

    }

    });

    render();

}

function render(){

    lista.innerHTML = "";

    agendamentos.forEach((a, i) => {

        lista.innerHTML += `
        <div class="card">

            <strong>${a.nome}</strong><br>

            📅 ${a.data} às ${a.hora}<br>

            🏠 ${a.endereco}, ${a.numero}<br>

            📞 ${a.telefone}<br>

            ✉ ${a.email}<br>

            📝 ${a.obs || "-"}

            <br><br>

            Status: <b>${a.status}</b>

            <div class="btns">
                <button class="excluir" onclick="excluir('${a.id}')">
                    Excluir
                </button>
            </div>

        </div>
        `;
    });

}

window.excluir = async function(id){

    if(confirm("Deseja excluir?")){

        await deleteDoc(
            doc(db, "agendamentos", id)
        );

        carregar();
    }
}

carregar();

</script>

</html>

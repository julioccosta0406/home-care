<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Agendamentos</title>
<script src="meus-agendamentos.js"></script>
<script src="cliente-auth.js"></script>
<link rel="stylesheet" href="meus-agendamentos.css">
</head>

<body>

<h1>📅 Agendamentos</h1>

<div id="lista"></div>

</body>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
deleteDoc,
doc,
query,
where,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDm7kfxjznOeBS30XIDhzkpWx2zbXwHy9Y",
  authDomain: "quality-life-d3d71.firebaseapp.com",
  projectId: "quality-life-d3d71",
  storageBucket: "quality-life-fe-d3d71.firebasestorage.app",
  messagingSenderId: "35765405424",
  appId: "1:35765405424:web:a6364a96c437f61f56e435",
  measurementId: "G-3TJ7ZTYD5X"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let lista = document.getElementById("lista");
const clientSession = window.QualityLifeClientAuth.requireLogin();

let agendamentos = [];

async function carregar(){

    const querySnapshot = await getDocs(
        collection(db, "agendamentos")
    );

    agendamentos = [];

    querySnapshot.forEach((docItem) => {

        const agendamento = docItem.data();

        if (!clientSession || agendamento.email !== clientSession.email) {
            return;
        }

        agendamentos.push({
            id: docItem.id,
            ...agendamento
        });

    });

    render();

}

function render(){

    lista.innerHTML = "";

    if (agendamentos.length === 0) {
        lista.innerHTML = `
        <div class="card">
            Nenhum agendamento encontrado para sua conta.
        </div>
        `;
        return;
    }

    agendamentos.forEach((a, i) => {

        lista.innerHTML += `
        <div class="card">

            <strong>${a.nome}</strong><br>

            📅 ${a.data} às ${a.hora}<br>

            🏠 ${a.endereco}, ${a.numero}<br>

            📞 ${a.telefone}<br>

            ✉ ${a.email}<br>

            📝 ${a.obs || "-"}

            <br><br>

            Status: <b>${a.status}</b>

            <div class="btns">
                <button class="excluir" onclick="excluir('${a.id}')">
                    Excluir
                </button>
            </div>

        </div>
        `;
    });

}

window.excluir = async function(id){

    if(confirm("Deseja excluir?")){

        const agendamentoCancelado = agendamentos.find((item) => item.id === id);
        const historicoSnapshot = await getDocs(
            query(
                collection(db, "historicoAgendamentos"),
                where("agendamentoId", "==", id)
            )
        );

        const updates = [];

        if (historicoSnapshot.empty && agendamentoCancelado) {
            await addDoc(
                collection(db, "historicoAgendamentos"),
                {
                    ...agendamentoCancelado,
                    agendamentoId: id,
                    status: "Cancelado",
                    statusHistorico: "Cancelado",
                    criadoEm: new Date().toISOString(),
                    atualizadoEm: new Date().toISOString()
                }
            );
        } else {
            historicoSnapshot.forEach((historicoDoc) => {
                updates.push(
                    updateDoc(
                        doc(db, "historicoAgendamentos", historicoDoc.id),
                        {
                            status: "Cancelado",
                            statusHistorico: "Cancelado",
                            atualizadoEm: new Date().toISOString()
                        }
                    )
                );
            });
        }

        await Promise.all(updates);

        await deleteDoc(
            doc(db, "agendamentos", id)
        );

        carregar();
    }
}

carregar();

</script>

</html>
